<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Baca di Alana</title>
    <meta
      name="description"
      content="Buka manga ini di aplikasi pembaca Alana."
    />
    <meta name="robots" content="noindex" />
    <!-- Tag di sini statis: crawler preview tidak menjalankan JavaScript,
         jadi judul dan sampul per-manga tidak bisa ikut di-preview. Yang
         bisa dijamin hanya tautannya dapat diklik. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alana" />
    <meta property="og:title" content="Baca di Alana" />
    <meta
      property="og:description"
      content="Buka manga ini di aplikasi pembaca Alana."
    />
    <link rel="stylesheet" href="/alana/manga/manga.css" />
  </head>
  <body>
    <main class="wrap">
      <p id="memuat" class="petunjuk">Memuat data manga…</p>
      <p id="galat" class="galat" hidden></p>

      <article id="kartu" class="kartu" hidden>
        <img id="cover" class="cover" alt="" />
        <h1 id="judul">-</h1>
        <p id="sub" class="sub"></p>

        <div id="nota-chapter" class="nota" hidden>
          <span class="nota-label">Chapter</span>
          <span id="chapter-nomor">-</span>
          <span id="chapter-ringkas" class="sub"></span>
        </div>

        <p id="sinopsis" class="sinopsis"></p>

        <a id="tombol" class="tombol" href="#">
          <span id="tombol-label">Buka di Alana</span>
        </a>
        <p class="petunjuk">
          Aplikasi belum terpasang? Buka Google Play, cari
          <strong>Alana</strong>, lalu masuk dengan akun yang sama.
        </p>
      </article>
    </main>

    <script src="/alana/manga/manga.js"></script>
  </body>
</html>
