name: Deploy Edge Functions

on:
  workflow_dispatch:

  push:
    branches: ["main"]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"

jobs:
  deploy:
    name: Deploy Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy rate-limit-login (publik, tanpa verify JWT)
        run: >
          supabase functions deploy rate-limit-login
          --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy delete-account (butuh JWT)
        run: >
          supabase functions deploy delete-account
          --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy login-with-username (publik, tanpa verify JWT)
        run: >
          supabase functions deploy login-with-username
          --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

