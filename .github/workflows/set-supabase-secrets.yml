name: Set Supabase Secrets (Firebase SA)

on:
  workflow_dispatch:

jobs:
  set-secrets:
    name: Set Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set FIREBASE_SERVICE_ACCOUNT_JSON
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          # Lewat env:, bukan argumen perintah. Nilai private key tidak pernah
          # muncul di argv sehingga tidak tampil di `ps`/`/proc/<pid>/cmdline`
          # dan tidak ikut terekspos kalau shell tracing pernah aktif.
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail

          # Nilai JSON bisa multi-line dan berisi karakter kutip, jadi tidak
          # boleh diinterpolasi langsung ke dalam skrip shell. Kompres dulu
          # supaya jadi satu baris, lalu kirim lewat --env-file (bukan argv).
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | jq -c . > sa.min.json

          if [ ! -s sa.min.json ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON kosong atau bukan JSON valid."
            exit 1
          fi

          # Format --env-file: KEY=value, satu baris per secret.
          printf 'FIREBASE_SERVICE_ACCOUNT_JSON=%s' "$(cat sa.min.json)" > sa.env

          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --env-file sa.env

          rm -f sa.min.json sa.env

      - name: Bersihkan sisa file
        if: always()
        run: rm -f sa.json sa.min.json sa.env
