name: Set Supabase Secrets (Firebase SA)

# Menjalankan manual saja: tab Actions → "Set Supabase Secrets" → Run workflow.
# Mengirim FIREBASE_SERVICE_ACCOUNT_JSON ke Supabase project secrets
# tanpa menampilkannya di log. File sementara selalu dihapus.

on:
  workflow_dispatch:

jobs:
  set-secrets:
    name: Set Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set FIREBASE_SERVICE_ACCOUNT_JSON
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > sa.json
          supabase secrets set --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} FIREBASE_SERVICE_ACCOUNT_JSON="$(cat sa.json)"
          rm -f sa.json

      - name: Bersihkan sisa file
        if: always()
        run: rm -f sa.json
