name: Build APK

on:
  push:
    branches: ["main"]

  workflow_dispatch:
    inputs:
      apk_mode:
        description: "Mode APK"
        type: choice
        default: "arm64"
        options:
          - "arm64"
          - "split-per-abi"

  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build & Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Cek versi Flutter
        run: flutter --version

      - name: Install dependency
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Siapkan keystore release (bila Secrets ada)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/alana-release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/alana-release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "Secrets keystore kosong — memakai debug keys."
          fi

      # Mode APK (lihat input workflow_dispatch `apk_mode`):
      # - "arm64" (bawaan, termasuk saat push): hanya 64-bit, 1 file.
      # - "split-per-abi": 3 file (arm64 + arm32 + x86_64), via Run workflow manual.
      - name: Build APK (release)
        run: |
          if [ "${{ inputs.apk_mode }}" = "split-per-abi" ]; then
            ABI_FLAGS="--split-per-abi"
          else
            ABI_FLAGS="--target-platform android-arm64"
          fi
          flutter build apk --release $ABI_FLAGS \
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
          --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          # Split per ABI: app-arm64-v8a-release.apk, app-armeabi-v7a-release.apk, ...
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 3
