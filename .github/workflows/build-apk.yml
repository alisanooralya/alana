name: Build APK

on:
  push:
    branches: ["main"]

  workflow_dispatch:

  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build & Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Cek versi Flutter
        run: flutter --version

      - name: Install dependency
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build APK (release)
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          # Split per ABI: app-arm64-v8a-release.apk, app-armeabi-v7a-release.apk, ...
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 3
